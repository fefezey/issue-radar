[project]
name = "issue-radar"
version = "0.1.0"
description = "Find new, unclaimed good first issues on GitHub and get notified."
readme = "README.md"
authors = [
    { name = "fefezey", email = "fefezey1903@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
]

[project.scripts]
issue-radar = "issue_radar:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
